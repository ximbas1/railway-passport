<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b35"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Railway Passport"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Railway Passport</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#102b35;background:#f4f7f5}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 16px 30px}main{max-width:540px;margin:auto}header{padding:24px 4px;display:flex;gap:12px;align-items:center}.logo{background:#102b35;color:white;border-radius:14px;padding:10px;font-size:24px}h1{font-size:21px;margin:0}.sub{color:#65777d;font-size:12px}.count,.card{border-radius:20px;padding:20px;margin-bottom:16px}.count{background:#102b35;color:white}.count small{color:#c4d2d2;text-transform:uppercase;letter-spacing:1px}.number{font-size:40px;font-weight:750}.card{background:white;border:1px solid #e1e9e5}h2{font-size:17px;margin:0 0 15px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}button,input{font:inherit}.choices button{padding:14px;border:1px solid #e1e9e5;border-radius:13px;background:white;font-weight:650}.choices button[aria-pressed=true]{background:#e7f3ed;border:2px solid #176b50;color:#176b50}label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}input{width:100%;padding:14px;border:1px solid #d8e2dd;border-radius:12px;font-size:16px}.shortcuts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.shortcuts button{border:1px solid #b9d7ca;background:#edf6f1;color:#176b50;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:650}.month{margin:15px 0 20px}.month-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:13px;font-weight:700}.month-track{height:15px;background:#edf3f0;border-radius:8px;overflow:hidden;margin:8px 0}.month-bar{height:100%;background:#176b50;border-radius:8px;min-width:0}.month-dest{font-size:12px;color:#65777d;line-height:1.5;overflow-wrap:anywhere}.save{width:100%;padding:15px;margin-top:14px;background:#176b50;color:white;border:0;border-radius:13px;font-weight:700}.ride{display:flex;align-items:center;gap:12px;border-top:1px solid #e1e9e5;padding:13px 0}.ico{font-size:22px;background:#eef3f1;padding:10px;border-radius:12px}.details{flex:1;min-width:0}.dest{font-weight:700;overflow-wrap:anywhere}.meta,.empty,footer{color:#65777d;font-size:12px}.delete{background:none;border:0;color:#9b5550;padding:8px}.empty{text-align:center;padding:20px 0;font-size:14px}footer{text-align:center;padding:8px}</style></head><body><main>
<header><div class="logo">🚆</div><div><h1>Railway Passport</h1><div class="sub">Your journeys, one by one.</div></div></header>
<section class="count"><small>Total journeys</small><div class="number" id="count">0</div></section>
<section class="card"><h2>Log a journey</h2><div class="choices"><button id="train" aria-pressed="true" type="button">🚆 Train</button><button id="bus" aria-pressed="false" type="button">🚌 Bus</button><button id="car" aria-pressed="false" type="button">🚗 Car</button></div><form id="form"><label for="destination">Destination</label><input id="destination" maxlength="100" placeholder="Where are you going?" required><div class="shortcuts" aria-label="Quick destinations"><button type="button" data-destination="Kundl">Kundl</button><button type="button" data-destination="Wörgl">Wörgl</button><button type="button" data-destination="Innsbruck">Innsbruck</button></div><button class="save">＋ Save journey</button></form></section>
<section class="card"><h2>Journey history <span class="sub">· Newest first</span></h2><div id="history"><div class="empty">No journeys yet. Log your first ride above.</div></div></section><section class="card"><h2>Journeys by month</h2><div id="monthly-chart" aria-live="polite"></div></section><footer>Stored on this device · No GPS · No account required</footer></main>
<script>
(()=>{const KEY='railway-passport-v1';let type='Train',rides=[];const $=id=>document.getElementById(id);function select(t){type=t;$('train').setAttribute('aria-pressed',t==='Train');$('bus').setAttribute('aria-pressed',t==='Bus');$('car').setAttribute('aria-pressed',t==='Car')}$('train').onclick=()=>select('Train');$('bus').onclick=()=>select('Bus');$('car').onclick=()=>select('Car');document.querySelectorAll('[data-destination]').forEach(b=>b.addEventListener('click',()=>{$('destination').value=b.dataset.destination;$('destination').focus()}));
function save(){localStorage.setItem(KEY,JSON.stringify(rides))}function render(){$('count').textContent=rides.length;const h=$('history');h.replaceChildren();if(!rides.length){const e=document.createElement('div');e.className='empty';e.textContent='No journeys yet. Log your first ride above.';h.append(e);renderChart();return}[...rides].sort((a,b)=>b.time-a.time).forEach(r=>{const row=document.createElement('div');row.className='ride';const ico=document.createElement('div');ico.className='ico';ico.textContent=r.type==='Train'?'🚆':r.type==='Car'?'🚗':'🚌';const details=document.createElement('div');details.className='details';const dest=document.createElement('div');dest.className='dest';dest.textContent=r.destination;const meta=document.createElement('div');meta.className='meta';meta.textContent=r.type+' · '+new Date(r.time).toLocaleString();const del=document.createElement('button');del.className='delete';del.textContent='Delete';del.onclick=()=>{if(confirm('Delete this journey?')){rides=rides.filter(x=>x.id!==r.id);save();render()}};details.append(dest,meta);row.append(ico,details,del);h.append(row)});renderChart()}
function renderChart(){const chart=$('monthly-chart');chart.replaceChildren();const months=new Map();rides.forEach(r=>{const dt=new Date(r.time);if(!Number.isFinite(dt.getTime()))return;const key=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');if(!months.has(key))months.set(key,{count:0,destinations:new Map()});const m=months.get(key);m.count++;const d=String(r.destination||'Unknown');m.destinations.set(d,(m.destinations.get(d)||0)+1)});if(!months.size){const empty=document.createElement('div');empty.className='empty';empty.textContent='Your monthly journey chart will appear here.';chart.append(empty);return}const max=Math.max(...[...months.values()].map(x=>x.count));[...months.entries()].sort((a,b)=>b[0].localeCompare(a[0])).forEach(([key,m])=>{const wrap=document.createElement('div');wrap.className='month';const top=document.createElement('div');top.className='month-top';const label=document.createElement('span');const [year,month]=key.split('-').map(Number);label.textContent=new Date(year,month-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});const count=document.createElement('span');count.textContent=m.count+' '+(m.count===1?'ride':'rides');top.append(label,count);const track=document.createElement('div');track.className='month-track';track.setAttribute('role','img');track.setAttribute('aria-label',label.textContent+': '+count.textContent);const bar=document.createElement('div');bar.className='month-bar';bar.style.width=(100*m.count/max)+'%';track.append(bar);const destinations=document.createElement('div');destinations.className='month-dest';destinations.textContent='Destinations: '+[...m.destinations.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([d,n])=>d+(n>1?' ('+n+'×)':'')).join(', ');wrap.append(top,track,destinations);chart.append(wrap)})}
try{rides=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){rides=[]}if(!Array.isArray(rides))rides=[];render();$('form').onsubmit=e=>{e.preventDefault();const d=$('destination').value.trim();if(!d)return;rides.push({id:Date.now()+Math.random(),type,destination:d,time:Date.now()});try{save()}catch(err){alert('Could not save. Check browser storage settings.')}render();$('destination').value='';$('destination').focus()};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
})();
</script></body></html>
