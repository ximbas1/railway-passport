<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b35"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Railway Passport"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Railway Passport</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#102b35;background:#f4f7f5}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 16px 30px}main{max-width:540px;margin:auto}header{padding:24px 4px;display:flex;gap:12px;align-items:center}.logo{background:#102b35;color:white;border-radius:14px;padding:10px;font-size:24px}h1{font-size:21px;margin:0}.sub{color:#65777d;font-size:12px}.count,.card{border-radius:20px;padding:20px;margin-bottom:16px}.count{background:#102b35;color:white}.count small{color:#c4d2d2;text-transform:uppercase;letter-spacing:1px}.number{font-size:40px;font-weight:750}.card{background:white;border:1px solid #e1e9e5}h2{font-size:17px;margin:0 0 15px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}button,input{font:inherit}.choices button{padding:14px;border:1px solid #e1e9e5;border-radius:13px;background:white;font-weight:650}.choices button[aria-pressed=true]{background:#e7f3ed;border:2px solid #176b50;color:#176b50}label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}input{width:100%;padding:14px;border:1px solid #d8e2dd;border-radius:12px;font-size:16px}.save{width:100%;padding:15px;margin-top:14px;background:#176b50;color:white;border:0;border-radius:13px;font-weight:700}.ride{display:flex;align-items:center;gap:12px;border-top:1px solid #e1e9e5;padding:13px 0}.ico{font-size:22px;background:#eef3f1;padding:10px;border-radius:12px}.details{flex:1;min-width:0}.dest{font-weight:700;overflow-wrap:anywhere}.meta,.empty,footer{color:#65777d;font-size:12px}.delete{background:none;border:0;color:#9b5550;padding:8px}.empty{text-align:center;padding:20px 0;font-size:14px}footer{text-align:center;padding:8px}</style></head><body><main>
<header><div class="logo">🚆</div><div><h1>Railway Passport</h1><div class="sub">Your journeys, one by one.</div></div></header>
<section class="count"><small>Total journeys</small><div class="number" id="count">0</div></section>
<section class="card"><h2>Log a journey</h2><div class="choices"><button id="train" aria-pressed="true" type="button">🚆 Train</button><button id="bus" aria-pressed="false" type="button">🚌 Bus</button></div><form id="form"><label for="destination">Destination</label><input id="destination" maxlength="100" placeholder="Where are you going?" required><button class="save">＋ Save journey</button></form></section>
<section class="card"><h2>Journey history <span class="sub">· Newest first</span></h2><div id="history"><div class="empty">No journeys yet. Log your first ride above.</div></div></section><footer>Stored on this device · No GPS · No account required</footer></main>
<script>
(()=>{const KEY='railway-passport-v1';let type='Train',rides=[];const $=id=>document.getElementById(id);function select(t){type=t;$('train').setAttribute('aria-pressed',t==='Train');$('bus').setAttribute('aria-pressed',t==='Bus')}$('train').onclick=()=>select('Train');$('bus').onclick=()=>select('Bus');
function save(){localStorage.setItem(KEY,JSON.stringify(rides))}function render(){$('count').textContent=rides.length;const h=$('history');h.replaceChildren();if(!rides.length){const e=document.createElement('div');e.className='empty';e.textContent='No journeys yet. Log your first ride above.';h.append(e);return}[...rides].sort((a,b)=>b.time-a.time).forEach(r=>{const row=document.createElement('div');row.className='ride';const ico=document.createElement('div');ico.className='ico';ico.textContent=r.type==='Train'?'🚆':'🚌';const details=document.createElement('div');details.className='details';const dest=document.createElement('div');dest.className='dest';dest.textContent=r.destination;const meta=document.createElement('div');meta.className='meta';meta.textContent=r.type+' · '+new Date(r.time).toLocaleString();const del=document.createElement('button');del.className='delete';del.textContent='Delete';del.onclick=()=>{if(confirm('Delete this journey?')){rides=rides.filter(x=>x.id!==r.id);save();render()}};details.append(dest,meta);row.append(ico,details,del);h.append(row)})}
try{rides=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){rides=[]}if(!Array.isArray(rides))rides=[];render();$('form').onsubmit=e=>{e.preventDefault();const d=$('destination').value.trim();if(!d)return;rides.push({id:Date.now()+Math.random(),type,destination:d,time:Date.now()});try{save()}catch(err){alert('Could not save. Check browser storage settings.')}render();$('destination').value='';$('destination').focus()};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
})();
</script></body></html>
